<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triqui · Tic-Tac-Toe</title>
<style>
  /* ── Reset & Base ─────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #e0e0e0;
  }

  /* ── Container ────────────────────────────────────── */
  .container {
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(12px);
    border-radius: 2.5rem;
    padding: 2.5rem 2.5rem 2rem;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.6);
    border: 1px solid rgba(255,255,255,.08);
    width: 420px;
    max-width: 94vw;
    text-align: center;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: .05em;
    margin-bottom: .25rem;
    background: linear-gradient(90deg, #f7971e, #ffd200);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .18em;
    color: rgba(255,255,255,.35);
    margin-bottom: 1.25rem;
  }

  /* ── Scoreboard ──────────────────────────────────── */
  .scoreboard {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: .5rem;
    margin-bottom: 1.5rem;
  }
  .score-card {
    flex: 1;
    padding: .6rem .4rem;
    border-radius: 1rem;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.06);
    transition: background .3s, transform .3s;
  }
  .score-card.active {
    background: rgba(255,255,255,.10);
    border-color: rgba(255,255,255,.18);
    transform: scale(1.04);
  }
  .score-card .label {
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    opacity: .6;
  }
  .score-card .score {
    font-size: 1.5rem;
    font-weight: 700;
  }
  .score-card.x .score { color: #60a5fa; }
  .score-card.o .score { color: #f472b6; }
  .score-divider {
    font-size: .8rem;
    opacity: .25;
    padding: 0 .15rem;
  }
  .score-card.draws .score { color: #a78bfa; }

  /* ── Turn indicator ──────────────────────────────── */
  .turn-indicator {
    margin-bottom: 1.25rem;
    font-size: .9rem;
  }
  .turn-indicator .mark {
    font-weight: 700;
    font-size: 1.1rem;
  }
  .turn-indicator .mark.x { color: #60a5fa; }
  .turn-indicator .mark.o { color: #f472b6; }

  /* ── Board ────────────────────────────────────────── */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 0 auto 1.5rem;
    max-width: 320px;
  }
  .cell {
    aspect-ratio: 1 / 1;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 1.2rem;
    font-size: 2.8rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .2s, transform .2s, box-shadow .25s;
    user-select: none;
    position: relative;
  }
  .cell:hover:not(.taken):not(.game-over) {
    background: rgba(255,255,255,.10);
    transform: scale(1.03);
  }
  .cell.taken { cursor: default; }
  .cell.game-over { cursor: default; }
  .cell.win {
    background: rgba(255,255,255,.10);
    box-shadow: 0 0 20px rgba(255,255,255,.12);
    border-color: rgba(255,255,255,.25);
  }
  .cell span {
    display: inline-block;
    transition: transform .2s;
  }

  /* ── Animations ──────────────────────────────────── */
  @keyframes pop-in {
    0%   { transform: scale(0); opacity: 0; }
    70%  { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
  .cell span.pop { animation: pop-in .3s cubic-bezier(.34,1.56,.64,1) forwards; }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 8px rgba(255,255,255,.06); }
    50%      { box-shadow: 0 0 22px rgba(255,255,255,.18); }
  }
  .cell.win { animation: pulse-glow 1.2s ease-in-out infinite; }

  @keyframes slide-up-fade {
    0%   { transform: translateY(8px); opacity: 0; }
    100% { transform: translateY(0);   opacity: 1; }
  }
  .status-message { animation: slide-up-fade .3s ease-out; }

  /* ── Status & Buttons ────────────────────────────── */
  .status-message {
    min-height: 2rem;
    margin-bottom: 1rem;
    font-size: .95rem;
    font-weight: 500;
  }
  .status-message.win  { color: #4ade80; }
  .status-message.draw { color: #a78bfa; }

  .btn-group {
    display: flex;
    gap: .6rem;
    justify-content: center;
  }
  .btn {
    padding: .55rem 1.4rem;
    border: none;
    border-radius: 2rem;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s;
    letter-spacing: .02em;
  }
  .btn:active { transform: scale(.96); }
  .btn-primary {
    background: linear-gradient(135deg, #f7971e, #ffd200);
    color: #1a1a2e;
    box-shadow: 0 4px 14px rgba(247,151,30,.3);
  }
  .btn-primary:hover { box-shadow: 0 6px 20px rgba(247,151,30,.45); }
  .btn-secondary {
    background: rgba(255,255,255,.07);
    color: #ccc;
    border: 1px solid rgba(255,255,255,.10);
  }
  .btn-secondary:hover { background: rgba(255,255,255,.13); }
</style>
</head>
<body>
<div class="container">
  <h1>✦ Triqui</h1>
  <p class="subtitle">Tic-Tac-Toe</p>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="score-card x" id="scoreX">
      <div class="label">X</div>
      <div class="score" id="scoreXVal">0</div>
    </div>
    <span class="score-divider">·</span>
    <div class="score-card draws" id="scoreDraws">
      <div class="label">Empates</div>
      <div class="score" id="scoreDrawsVal">0</div>
    </div>
    <span class="score-divider">·</span>
    <div class="score-card o" id="scoreO">
      <div class="label">O</div>
      <div class="score" id="scoreOVal">0</div>
    </div>
  </div>

  <!-- Turn indicator -->
  <div class="turn-indicator" id="turnIndicator">
    Turno de <span class="mark x" id="turnMark">X</span>
  </div>

  <!-- Board -->
  <div class="board" id="board"></div>

  <!-- Status -->
  <div class="status-message" id="statusMsg">¡A jugar!</div>

  <!-- Buttons -->
  <div class="btn-group">
    <button class="btn btn-primary" id="resetBtn">↻ Nuevo juego</button>
    <button class="btn btn-secondary" id="resetScoreBtn">Reset puntajes</button>
  </div>
</div>

<script>
  (function(){
    /* ── State ──────────────────────────────────────── */
    const N = 3;
    const WINNING_COMBOS = [
      [0,1,2],[3,4,5],[6,7,8],  // rows
      [0,3,6],[1,4,7],[2,5,8],  // cols
      [0,4,8],[2,4,6]           // diags
    ];

    let board     = Array(N * N).fill(null);
    let current   = 'X';               // 'X' or 'O'
    let gameOver  = false;
    let moves     = 0;

    let scores    = { X: 0, O: 0, draws: 0 };
    let winCells  = [];

    /* ── DOM refs ───────────────────────────────────── */
    const boardEl      = document.getElementById('board');
    const turnMark     = document.getElementById('turnMark');
    const turnIndicator= document.getElementById('turnIndicator');
    const statusMsg    = document.getElementById('statusMsg');
    const scoreXVal    = document.getElementById('scoreXVal');
    const scoreOVal    = document.getElementById('scoreOVal');
    const scoreDrawsVal= document.getElementById('scoreDrawsVal');
    const scoreXCard   = document.getElementById('scoreX');
    const scoreOCard   = document.getElementById('scoreO');
    const scoreDrawsCard= document.getElementById('scoreDraws');
    const resetBtn     = document.getElementById('resetBtn');
    const resetScoreBtn= document.getElementById('resetScoreBtn');

    /* ── Render helpers ─────────────────────────────── */
    function renderBoard() {
      boardEl.innerHTML = '';
      for (let i = 0; i < N * N; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.idx = i;
        if (gameOver || board[i] !== null) cell.classList.add('taken');
        if (gameOver) cell.classList.add('game-over');

        if (board[i] !== null) {
          const span = document.createElement('span');
          span.textContent = board[i];
          span.className = 'pop';
          cell.appendChild(span);
        }

        // highlight win cells
        if (winCells.includes(i)) cell.classList.add('win');

        cell.addEventListener('click', () => handleClick(i));
        boardEl.appendChild(cell);
      }
    }

    function updateScores() {
      scoreXVal.textContent     = scores.X;
      scoreOVal.textContent     = scores.O;
      scoreDrawsVal.textContent = scores.draws;
    }

    function updateTurn() {
      if (gameOver) return;
      turnMark.textContent = current;
      turnMark.className = 'mark ' + (current === 'X' ? 'x' : 'o');

      // highlight active score card
      scoreXCard.classList.toggle('active', current === 'X');
      scoreOCard.classList.toggle('active', current === 'O');
      scoreDrawsCard.classList.remove('active');
    }

    function setStatus(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = 'status-message' + (type ? ' ' + type : '');
    }

    function updateAll() {
      renderBoard();
      updateScores();
      updateTurn();
    }

    /* ── Game logic ─────────────────────────────────── */
    function checkWinner() {
      for (const combo of WINNING_COMBOS) {
        const [a,b,c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          winCells = combo;
          return board[a];
        }
      }
      return null;
    }

    function handleClick(idx) {
      if (gameOver) return;
      if (board[idx] !== null) return;

      // place mark
      board[idx] = current;
      moves++;

      // check
      const winner = checkWinner();
      if (winner) {
        gameOver = true;
        scores[winner]++;
        const name = winner === 'X' ? 'X' : 'O';
        setStatus(`¡${name} gana! 🎉`, 'win');
        updateAll();
        return;
      }

      if (moves === N * N) {
        // draw
        gameOver = true;
        scores.draws++;
        setStatus('¡Empate!', 'draw');
        updateAll();
        return;
      }

      // switch turn
      current = current === 'X' ? 'O' : 'X';
      updateAll();
    }

    function resetBoard() {
      board     = Array(N * N).fill(null);
      current   = 'X';
      gameOver  = false;
      moves     = 0;
      winCells  = [];
      setStatus('¡A jugar!');
      updateAll();
    }

    function resetScores() {
      scores = { X: 0, O: 0, draws: 0 };
      resetBoard();
    }

    /* ── Init ───────────────────────────────────────── */
    resetBtn.addEventListener('click', resetBoard);
    resetScoreBtn.addEventListener('click', resetScores);
    resetBoard();
  })();
</script>
</body>
</html>
